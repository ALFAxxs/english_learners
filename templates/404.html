{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%AE</text></svg>">
<title>404 – Page Not Found | VerbQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f7ff;
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --card: #ffffff;
    --shadow: 0 4px 24px rgba(59,130,246,0.10);
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(145deg, #e0f2fe 0%, #f0fdf4 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(59,130,246,0.10) 0%, transparent 70%);
    top: -150px; right: -100px;
    border-radius: 50%;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 70%);
    bottom: -100px; left: -80px;
    border-radius: 50%;
    pointer-events: none;
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 56px 48px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.88) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .error-code {
    font-family: 'Space Mono', monospace;
    font-size: clamp(5rem, 20vw, 8rem);
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
    margin-bottom: 8px;
    opacity: 0.15;
    letter-spacing: -4px;
    user-select: none;
  }

  .emoji {
    font-size: 4rem;
    margin-bottom: 16px;
    display: block;
    margin-top: -40px;
  }

  .title {
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 1rem;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 360px;
    margin: 0 auto 36px;
  }

  .verb-hint {
    background: rgba(59,130,246,0.06);
    border: 1.5px solid rgba(59,130,246,0.15);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    color: var(--primary);
    font-weight: 700;
  }
  .verb-hint .arrow { color: var(--text-muted); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 32px;
    border-radius: 99px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 20px rgba(59,130,246,0.30);
  }
  .btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(59,130,246,0.40);
  }
  .btn:active { transform: scale(0.97); }

  .logo {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.5px;
    z-index: 2;
    text-decoration: none;
  }

  @media (max-width: 480px) {
    .card { padding: 40px 24px; }
  }
</style>
</head>
<body>

<a href="/" class="logo">VerbQuest</a>

<div class="card">
  <div class="error-code">404</div>
  <span class="emoji">🔍</span>
  <h1 class="title">Page Not Found</h1>
  <p class="subtitle">
    Looks like this page got lost — just like an irregular verb you forgot to study!
  </p>

  <div class="verb-hint">
    <span>find</span>
    <span class="arrow">→</span>
    <span>found</span>
    <span class="arrow">→</span>
    <span>found</span>
  </div>

  <a href="/" class="btn btn-primary">🏠 Go Back Home</a>
</div>

</body>
</html>
